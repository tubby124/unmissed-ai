<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>test-prompt-live — Ultravox WebRTC harness</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #e5e5e5;
      --muted: #888;
      --accent: #4ade80;
      --warn: #f59e0b;
      --err: #ef4444;
      --user: #60a5fa;
      --agent: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;
      min-height: 100vh;
      padding: 24px;
    }
    h1 { font-size: 16px; margin: 0 0 16px; color: var(--accent); }
    .meta { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
    .row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    button {
      background: var(--accent);
      color: #0a0a0a;
      border: none;
      padding: 10px 20px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.danger { background: var(--err); color: white; }
    #status {
      font-size: 12px;
      color: var(--muted);
      padding: 4px 10px;
      background: #1a1a1a;
      border-radius: 4px;
    }
    #status.active { color: var(--accent); border-left: 2px solid var(--accent); }
    #status.error { color: var(--err); border-left: 2px solid var(--err); }
    #transcript {
      margin-top: 16px;
      padding: 16px;
      background: #111;
      border-radius: 4px;
      max-height: 60vh;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .turn { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #222; }
    .turn:last-child { border-bottom: none; }
    .turn-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.6; }
    .turn.user .turn-label { color: var(--user); }
    .turn.agent .turn-label { color: var(--agent); }
    .turn-text { font-size: 13px; }
    .hint { color: var(--muted); font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>test-prompt-live — WebRTC harness</h1>
  <div class="meta" id="meta">Loading…</div>
  <div class="row">
    <button id="start">Connect & Start Talking</button>
    <button id="end" class="danger" disabled>End Call</button>
    <span id="status">idle</span>
  </div>
  <div class="hint">After hangup, return to your terminal — the CLI script polls Ultravox and writes the report. Tab can stay open.</div>
  <div id="transcript"></div>

  <script type="module">
    import { UltravoxSession, UltravoxSessionStatus } from 'https://esm.sh/ultravox-client@0.5.0'

    const hash = new URLSearchParams(location.hash.slice(1))
    const joinUrl = hash.get('joinUrl')
    const callId = hash.get('callId') || '?'
    const slug = hash.get('slug') || '?'
    const maxSeconds = parseInt(hash.get('maxSeconds') || '180', 10)

    const statusEl = document.getElementById('status')
    const startBtn = document.getElementById('start')
    const endBtn = document.getElementById('end')
    const transcriptEl = document.getElementById('transcript')
    const metaEl = document.getElementById('meta')

    metaEl.textContent = `slug=${slug} • callId=${callId} • maxSeconds=${maxSeconds}`

    if (!joinUrl) {
      statusEl.textContent = 'ERROR: missing joinUrl in URL hash'
      statusEl.className = 'error'
      startBtn.disabled = true
      throw new Error('missing joinUrl')
    }

    let session = null
    let lastTranscriptHash = ''

    function renderTranscripts(arr) {
      const html = arr.map(t => {
        const cls = t.speaker === 'user' ? 'user' : 'agent'
        const label = t.speaker === 'user' ? 'CALLER' : 'AGENT'
        const finalMark = t.isFinal ? '' : ' (…)'
        return `<div class="turn ${cls}"><div class="turn-label">${label}${finalMark}</div><div class="turn-text">${escapeHtml(t.text)}</div></div>`
      }).join('')
      const hash = html.length + '|' + (arr[arr.length - 1]?.text || '')
      if (hash !== lastTranscriptHash) {
        transcriptEl.innerHTML = html
        transcriptEl.scrollTop = transcriptEl.scrollHeight
        lastTranscriptHash = hash
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
    }

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true
      statusEl.textContent = 'requesting mic…'
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
        stream.getTracks().forEach(t => t.stop())
      } catch (e) {
        statusEl.textContent = 'ERROR: mic permission denied'
        statusEl.className = 'error'
        return
      }

      statusEl.textContent = 'connecting…'
      session = new UltravoxSession()

      session.addEventListener('status', () => {
        const s = session.status
        if (s === UltravoxSessionStatus.SPEAKING) { statusEl.textContent = 'agent speaking'; statusEl.className = 'active' }
        else if (s === UltravoxSessionStatus.LISTENING) { statusEl.textContent = 'listening for you'; statusEl.className = 'active' }
        else if (s === UltravoxSessionStatus.THINKING) { statusEl.textContent = 'agent thinking…'; statusEl.className = 'active' }
        else if (s === UltravoxSessionStatus.DISCONNECTED) {
          statusEl.textContent = 'call ended — return to terminal'
          statusEl.className = ''
          endBtn.disabled = true
        }
      })

      session.addEventListener('transcripts', () => {
        const arr = (session.transcripts || []).map(t => ({
          speaker: t.speaker === 'user' ? 'user' : 'agent',
          text: t.text || '',
          isFinal: t.isFinal,
        }))
        renderTranscripts(arr)
      })

      try {
        await session.joinCall(joinUrl)
        endBtn.disabled = false
      } catch (e) {
        statusEl.textContent = 'ERROR: ' + e.message
        statusEl.className = 'error'
        startBtn.disabled = false
      }
    })

    endBtn.addEventListener('click', async () => {
      endBtn.disabled = true
      try { await session?.leaveCall() } catch {}
    })
  </script>
</body>
</html>
