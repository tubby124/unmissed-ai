name: Uptime check

# The app IS every client's phone line — Twilio primary and fallback both
# point at it, so an outage means callers hear Twilio's error tone with no
# signal to the operator. This pings /api/health every 5 minutes and
# Telegram-alerts on failure. Deploy gating (railway.json healthcheckPath)
# only covers deploys, not runtime outages.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        id: ping
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://endvoicemail.ai/api/health || echo "000")
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "final_code=$code" >> "$GITHUB_OUTPUT"
          exit 1
      - name: Telegram alert on failure
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_OWNER_CHAT_ID }}" \
            --data-urlencode "text=🔴 endvoicemail.ai is DOWN — /api/health failed 3x (last HTTP ${{ steps.ping.outputs.final_code }}). Every client line is affected. Check Railway now: https://railway.app" \
            > /dev/null
