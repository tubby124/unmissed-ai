    assert:
      - type: not-icontains-any
        value: ["$1M coverage", "$2 million liability", "we're insured up to"]
      - type: icontains-any
        value: ["let me check", "{{CLOSE_PERSON}}", "project manager", "team", "our manager", "insurance", "call you back", "call ya back"]

  - description: "KB 3 — caller asks for sample portfolio / past projects (route)"
    vars:
