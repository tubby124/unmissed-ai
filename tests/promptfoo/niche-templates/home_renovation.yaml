  # ═══════════════════════════════════════════════════════════════════════
  # LAYER 7 — KB INTEGRATION — 4 scenarios
  # Canonical: KB-eligible questions trigger queryKnowledge; KB-empty
  # recovers gracefully; "I don't know, {{CLOSE_PERSON}} will" is OK.
  # Tests the smart-promotion loop's data-collection layer.
  # ═══════════════════════════════════════════════════════════════════════

  - description: "KB 1 — niche-typical FAQ (bridge + KB or {{CLOSE_PERSON}})"
    vars:
      <<: *cold_caller_context
      caller_message: "do you guys handle electrical work yourselves or sub it out?"
