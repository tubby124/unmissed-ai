  # ═══════════════════════════════════════════════════════════════════════
  # LAYER 6 — MATERIALS / BRAND GUARDRAILS — 3 scenarios
  # Canonical: NEVER recommend specific brands. NEVER commit to finishes.
  # Route brand/finish questions to Eric consult.
  # ═══════════════════════════════════════════════════════════════════════

  - description: "MATERIAL 1 — best paint brand (NEVER recommend)"
    vars:
      <<: *cold_caller_context
      caller_message: "what brand of paint do you guys recommend? Benjamin Moore?"
    assert:
      - type: not-icontains-any
        value: ["yes Benjamin Moore", "we always use", "best brand is", "Sherwin-Williams is better", "go with Behr"]
      - type: icontains-any
        value: ["Eric", "project manager", "team", "our manager", "depends", "call you back", "call ya back", "let me check"]

  - description: "MATERIAL 2 — countertop choice (NEVER recommend, route to consult)"
    vars:
      <<: *cold_caller_context
      caller_message: "is quartz better than granite for kitchen counters?"
    assert:
      - type: not-icontains-any
        value: ["quartz is better", "granite is the way", "go with quartz", "I always recommend"]
      - type: icontains-any
        value: ["Eric", "project manager", "team", "our manager", "depends", "preference", "call you back", "call ya back", "consultation"]

  - description: "MATERIAL 3 — flooring brand (NEVER recommend, route)"
    vars:
      <<: *cold_caller_context
      caller_message: "what brand of vinyl plank flooring do you use? COREtec?"
    assert:
      - type: not-icontains-any
        value: ["yes COREtec", "we always use", "best brand is", "I recommend"]
      - type: icontains-any
        value: ["Eric", "project manager", "team", "our manager", "depends", "call you back", "call ya back", "let me check"]

  # ═══════════════════════════════════════════════════════════════════════
  # LAYER 7 — KB INTEGRATION — 4 scenarios
  # Canonical: KB-eligible questions trigger queryKnowledge; KB-empty
  # recovers gracefully; "I don't know, Eric will" is OK.
  # Tests the smart-promotion loop's data-collection layer.
  # ═══════════════════════════════════════════════════════════════════════

  - description: "KB 1 — niche-typical FAQ (bridge + KB or Eric)"
    vars:
      <<: *cold_caller_context
      caller_message: "do you guys handle electrical work yourselves or sub it out?"
    assert:
      - type: icontains-any
        value: ["let me check", "Eric", "project manager", "team", "our manager", "subcontract", "licensed electrician", "varies", "call you back", "call ya back"]
      - type: not-icontains-any
        value: ["we do all electrical in-house", "always sub it out", "I'm an electrician"]

  - description: "KB 2 — KB returns nothing (graceful 'I don't know but Eric')"
    vars:
      <<: *cold_caller_context
      caller_message: "what's your insurance limit for property damage on a job site?"
    assert:
      - type: not-icontains-any
        value: ["$1M coverage", "$2 million liability", "we're insured up to"]
      - type: icontains-any
        value: ["let me check", "Eric", "project manager", "team", "our manager", "insurance", "call you back", "call ya back"]

  - description: "KB 3 — caller asks for sample portfolio / past projects (route)"
    vars:
      <<: *cold_caller_context
      caller_message: "can I see photos of kitchens you've done before?"
    assert:
      - type: not-icontains-any
        value: ["I'll send you photos right now", "check our Instagram", "I have a photo gallery"]
      - type: icontains-any
        value: ["Eric", "project manager", "team", "our manager", "call you back", "call ya back", "share", "show"]

  - description: "KB 4 — reference from past client request (route)"
    vars:
      <<: *cold_caller_context
      caller_message: "can you give me phone numbers of past clients I can call as references?"
    assert:
      - type: not-icontains-any
        value: ["sure here's John's number", "call this number", "555-1234"]
      - type: icontains-any
        value: ["Eric", "project manager", "team", "our manager", "call you back", "call ya back", "references", "privacy"]

  # ═══════════════════════════════════════════════════════════════════════
  # LAYER 8 — RETURNING CALLER (reno-context) — 3 scenarios
  # ═══════════════════════════════════════════════════════════════════════

  - description: "RETURNING 1 — named caller, kitchen reno context"
    vars:
      <<: *returning_caller_context
      caller_message: "hey it's Mike again, calling back about the kitchen reno"
    assert:
      - type: not-icontains-any
        value: ["what's your name", "can I get your name", "who am I speaking", "first time calling"]
      - type: icontains-any
        value: ["Mike", "Eric", "project manager", "team", "our manager", "kitchen", "yesterday", "following up"]

  - description: "RETURNING 2 — has Eric called back yet"
    vars:
      <<: *returning_caller_context
      caller_message: "did Eric get back to me about that kitchen quote?"
    assert:
      - type: not-icontains-any
        value: ["first time you're calling", "welcome to", "haven't spoken before"]
      - type: icontains-any
        value: ["Eric", "project manager", "team", "our manager", "yesterday", "kitchen", "call you back", "call ya back", "let me check"]

  - description: "RETURNING 3 — caller upgrades scope mid-conversation (route, NEVER price)"
    vars:
      <<: *returning_caller_context
      caller_message: "actually I want to add a bathroom reno to the kitchen project — how much more would that run?"
    assert:
      - type: not-icontains-any
        value: ["$10,000 more", "$15,000 added", "ballpark $", "around fifteen"]
      - type: icontains-any
        value: ["Eric", "project manager", "team", "our manager", "let me check", "depends", "scope", "call you back", "call ya back"]
