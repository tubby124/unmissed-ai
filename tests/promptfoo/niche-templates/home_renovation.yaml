      - type: icontains-any
        value: ["{{CLOSE_PERSON}}", "project manager", "team", "our manager", "call you back", "call ya back", "references", "privacy"]

  # ═══════════════════════════════════════════════════════════════════════
  # LAYER 8 — RETURNING CALLER (reno-context) — 3 scenarios
  # ═══════════════════════════════════════════════════════════════════════

  - description: "RETURNING 1 — named caller, kitchen reno context"
    vars:
